- name: Create qbittorrent config directory
  file:
    path: "{{compose_qbittorrent_config}}"
    state: directory
    mode: '0700'
    owner: "{{compose_qbittorrent_uuid}}"
    group: "{{compose_qbittorrent_guid}}"
  become: true

- name: Create qbittorrent downloads directory
  file:
    path: "{{compose_qbittorrent_downloads}}"
    state: directory
    mode: '0700'
    owner: "{{compose_qbittorrent_uuid}}"
    group: "{{compose_qbittorrent_guid}}"
  become: true
