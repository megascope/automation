# from https://hub.docker.com/_/caddy/
compose_caddy_home: "{{compose_project_root}}/caddy"
compose_caddy_tasks: true

compose_caddy_capabilities: []
# might need NET_BIND_SERVICE

# set to "host" to run caddy with host networking
# leave as null to use normal bridge networking with port mappings
compose_caddy_network_mode: null

compose_caddy_ports:
  - "80:80"
  - "443:443"
  - "443:443/udp"

# note that compose_caddy_config is not the "config" folder, but the
# conf folder that the Caddyfile and certs can be put in

compose_caddy_caddyfile_template: caddy_Caddyfile.j2
compose_caddy_conf: "{{compose_caddy_home}}/conf"
compose_caddy_caddyfile: "{{compose_caddy_conf}}/Caddyfile"
compose_caddy_srv: "{{compose_caddy_home}}/srv"

# set this to mount the specified directory into /etc/ssl/private
compose_caddy_certs: null

# A list of jinja templates to copy to the srv folder
compose_caddy_srv_templates: []

compose_caddy_restart_policy: "always"
