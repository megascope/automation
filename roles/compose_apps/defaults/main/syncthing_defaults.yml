# renovate: datasource=docker depName=syncthing/syncthing
compose_syncthing_version: "2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546"

# renovate: datasource=docker depName=alpine
compose_syncthing_init_version: "3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"

compose_syncthing_image: "syncthing/syncthing:{{ compose_syncthing_version }}"
compose_syncthing_hostname: syncthing

# user/group to run as
compose_syncthing_uuid: 1000
compose_syncthing_guid: 1000

compose_syncthing_tasks: true
compose_syncthing_config_directory: null
compose_syncthing_config_volume: "{{ compose_syncthing_config_directory if compose_runtime == 'incus' and compose_syncthing_config_directory is not none else 'syncthing-config' }}"
compose_syncthing_config_target: "{{ '/config' if compose_runtime == 'incus' else '/var/syncthing/config' }}"
compose_syncthing_volumes:
  - "/tmp:/var/syncthing"

compose_syncthing_ports:
  - "8384:8384"
  - "22000:22000"
  - "22000:22000/udp"

compose_syncthing_restart_policy: unless-stopped

compose_syncthing_healthcheck_enabled: "{{ compose_runtime != 'incus' }}"
compose_syncthing_healthcheck_test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
compose_syncthing_healthcheck_interval: 1m
compose_syncthing_healthcheck_timeout: 10s
compose_syncthing_healthcheck_retries: 3
