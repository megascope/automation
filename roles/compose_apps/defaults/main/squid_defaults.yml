compose_squid_tasks: true
compose_squid_conf_template: squid_squid.conf.j2
compose_squid_home: "{{compose_project_root}}/squid"
compose_squid_cache_enabled: true
compose_squid_healthcheck_enabled: true
compose_squid_healthcheck_test: "squid -k check -f /etc/squid/squid.conf >/dev/null 2>&1 || exit 1"
compose_squid_healthcheck_interval: 30s
compose_squid_healthcheck_timeout: 5s
compose_squid_healthcheck_retries: 5
compose_squid_healthcheck_start_period: 15s
compose_squid_default_route_mode: direct
compose_squid_fallback_proxy_host: null
compose_squid_fallback_proxy_port: null

# set this if you want the port to be forwarded
compose_squid_ports:
  - "3128:3128"

# set this if you want this to be in the same docker network
# as something else
compose_squid_shared_network: null

# use this to have the container share network namespace with another
compose_squid_upstream_container: null

compose_squid_proxy_user: proxy
