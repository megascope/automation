- name: Create caddy web root directory
  ansible.builtin.file:
    path: "{{ packages_caddy_srv }}"
    state: directory
    owner: "{{ packages_caddy_user }}"
    group: "{{ packages_caddy_group }}"
    mode: '755'
  become: true

- name: Create caddy systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Configure caddy automatic restarts
  ansible.builtin.template:
    src: caddy-restart.conf.j2
    dest: /etc/systemd/system/caddy.service.d/10-restart.conf
    owner: root
    group: root
    mode: '0644'
  register: packages_caddy_systemd_override
  become: true

- name: Set caddyfile
  ansible.builtin.template:
    src: "{{packages_caddy_caddyfile_template}}"
    dest: "{{packages_caddy_config}}"
    owner: "{{packages_caddy_user}}"
    group: "{{packages_caddy_group}}"
    mode: '440'
    validate: 'caddy validate --config %s --adapter caddyfile'
  become: true

- name: Copy caddy web data
  ansible.builtin.template:
    src: "{{ packages_caddy_item }}"
    dest: "{{ packages_caddy_srv }}/{{ packages_caddy_item | basename | regex_replace('\\.j2$', '') }}"
    owner: "{{ packages_caddy_user }}"
    group: "{{ packages_caddy_group }}"
    mode: '444'
  loop: "{{ packages_caddy_srv_templates }}"
  loop_control:
    loop_var: packages_caddy_item
  become: true

- name: Enable and start caddy with the current systemd configuration
  ansible.builtin.systemd_service:
    name: caddy.service
    daemon_reload: "{{ packages_caddy_systemd_override.changed }}"
    enabled: true
    state: started
  become: true
