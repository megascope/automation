- name: Add administrators to the incus-admin group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: incus-admin
    append: true
  loop: "{{ incus_admin_users }}"

- name: Read administrators' Incus client defaults
  become: true
  become_user: "{{ incus_admin_user }}"
  become_flags: -H
  ansible.builtin.command:
    argv:
      - incus
      - default
      - show
  register: incus_admin_client_defaults
  changed_when: false
  check_mode: false
  loop: "{{ incus_admin_users }}"
  loop_control:
    loop_var: incus_admin_user

- name: Configure administrators' SPICE HTML5 console helper
  become: true
  become_user: "{{ incus_admin_default.incus_admin_user }}"
  become_flags: -H
  ansible.builtin.command:
    argv:
      - incus
      - default
      - set
      - console_spice_command=/usr/local/bin/incus-spice-html5 SOCKET
  loop: "{{ incus_admin_client_defaults.results }}"
  loop_control:
    loop_var: incus_admin_default
    label: "{{ incus_admin_default.incus_admin_user }}"
  when: >-
    (incus_admin_default.stdout | from_yaml).console_spice_command
    != '/usr/local/bin/incus-spice-html5 SOCKET'

- name: Wait for the Incus daemon
  become: true
  ansible.builtin.command: incus info
  register: incus_daemon_ready
  changed_when: false
  check_mode: false
  retries: 10
  delay: 2
  until: incus_daemon_ready.rc == 0

- name: Check for the default Incus storage pool
  become: true
  ansible.builtin.command: incus storage show default
  register: incus_default_storage
  changed_when: false
  failed_when: false
  check_mode: false

- name: Initialize Incus
  become: true
  ansible.builtin.command:
    argv:
      - incus
      - admin
      - init
      - --auto
      - "--storage-backend={{ incus_storage_backend }}"
  when: incus_default_storage.rc != 0

- name: Create directory-backed Incus storage pool sources
  become: true
  ansible.builtin.file:
    path: "{{ item.config.source }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - item.driver | default('dir') == 'dir'
    - item.config is defined
    - item.config.source is defined
    - item.config.source.startswith('/')
  loop: "{{ incus_storage_pools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read configured Incus storage pools
  become: true
  ansible.builtin.command:
    argv:
      - incus
      - storage
      - show
      - "{{ item.name }}"
  register: incus_configured_storage_pools
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ incus_storage_pools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create configured Incus storage pools
  become: true
  ansible.builtin.command: >-
    incus storage create {{ item.item.name }} {{ item.item.driver | default('dir') }}
    {% for option in item.item.config | default({}) | dict2items %}
    {{ option.key }}={{ option.value }}
    {% endfor %}
  when: item.rc != 0
  loop: "{{ incus_configured_storage_pools.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read the default Incus profile
  become: true
  ansible.builtin.command: incus profile show default
  register: incus_default_profile_show
  changed_when: false
  check_mode: false

- name: Record the default Incus profile
  ansible.builtin.set_fact:
    incus_default_profile: "{{ incus_default_profile_show.stdout | from_yaml }}"

- name: Record the default Incus profile root disk
  ansible.builtin.set_fact:
    incus_default_profile_root_current: >-
      {{
        incus_default_profile.devices
        | default({})
        | dict2items
        | selectattr('key', 'equalto', incus_default_profile_root_name)
        | map(attribute='value')
        | first
        | default({})
      }}

- name: Remove the default profile root disk when it differs
  become: true
  ansible.builtin.command:
    argv:
      - incus
      - profile
      - device
      - remove
      - default
      - "{{ incus_default_profile_root_name }}"
  when:
    - incus_default_profile_root_current | length > 0
    - incus_default_profile_root_current != incus_default_profile_root

- name: Add the default profile root disk when it differs
  become: true
  ansible.builtin.command: >-
    incus profile device add default {{ incus_default_profile_root_name }}
    {{ incus_default_profile_root.type }}
    {% for option in incus_default_profile_root | dict2items | rejectattr('key', 'equalto', 'type') %}
    {{ option.key }}={{ option.value }}
    {% endfor %}
  when: incus_default_profile_root_current != incus_default_profile_root

- name: Record the default Incus profile NIC
  ansible.builtin.set_fact:
    incus_default_profile_nic_current: >-
      {{
        incus_default_profile.devices
        | default({})
        | dict2items
        | selectattr('key', 'equalto', incus_default_profile_nic_name)
        | map(attribute='value')
        | first
        | default({})
      }}

- name: Remove the default profile NIC when it differs
  become: true
  ansible.builtin.command:
    argv:
      - incus
      - profile
      - device
      - remove
      - default
      - "{{ incus_default_profile_nic_name }}"
  when:
    - incus_default_profile_nic_current | length > 0
    - incus_default_profile_nic_current != incus_default_profile_nic

- name: Add the default profile NIC when it differs
  become: true
  ansible.builtin.command: >-
    incus profile device add default {{ incus_default_profile_nic_name }}
    {{ incus_default_profile_nic.type }}
    {% for option in incus_default_profile_nic | dict2items | rejectattr('key', 'equalto', 'type') %}
    {{ option.key }}={{ option.value }}
    {% endfor %}
  when: incus_default_profile_nic_current != incus_default_profile_nic

- name: Trust the Incus bridge in firewalld
  become: true
  ansible.posix.firewalld:
    zone: "{{ incus_firewalld_zone }}"
    interface: "{{ incus_bridge_name }}"
    state: enabled
    permanent: true
    immediate: true
  when: firewall_enable | default(false) | bool

- name: Read the Incus bridge IPv4 address
  become: true
  ansible.builtin.command: "incus network get {{ incus_bridge_name }} ipv4.address"
  register: incus_bridge_ipv4
  changed_when: false
  check_mode: false
  when: incus_compose_install | bool

- name: Read the Incus API listen address
  become: true
  ansible.builtin.command: incus config get core.https_address
  register: incus_https_address
  changed_when: false
  check_mode: false
  when: incus_compose_install | bool

- name: Bind the Incus API to its private bridge for incus-compose
  become: true
  ansible.builtin.command:
    argv:
      - incus
      - config
      - set
      - core.https_address
      - "{{ (incus_bridge_ipv4.stdout | trim).split('/')[0] }}:{{ incus_compose_api_port }}"
  vars:
    incus_compose_https_address: "{{ (incus_bridge_ipv4.stdout | trim).split('/')[0] }}:{{ incus_compose_api_port }}"
  when:
    - incus_compose_install | bool
    - incus_https_address.stdout | trim != incus_compose_https_address

- name: Check the installed incus-compose version
  ansible.builtin.command: /usr/local/bin/incus-compose version
  register: incus_compose_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: incus_compose_install | bool

- name: Record the installed incus-compose release
  ansible.builtin.set_fact:
    incus_compose_installed_release: >-
      {{
        incus_compose_installed_version.stdout
        | default('')
        | regex_search('[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?')
        | default('', true)
      }}
  when: incus_compose_install | bool

- name: Validate the incus-compose release architecture
  ansible.builtin.assert:
    that:
      - incus_compose_release_architecture | length > 0
      - incus_compose_release_architecture in incus_compose_checksums
    fail_msg: >-
      incus-compose {{ incus_compose_version }} is not configured for
      {{ ansible_facts['architecture'] }}.
  when: incus_compose_install | bool

- name: Download the pinned incus-compose release
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/lxc/incus-compose/releases/download/v{{ incus_compose_version }}/incus-compose_{{ incus_compose_version }}_linux_{{ incus_compose_release_architecture }}.tar.gz
    dest: "{{ incus_compose_archive }}"
    checksum: "sha256:{{ incus_compose_checksums[incus_compose_release_architecture] }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - incus_compose_install | bool
    - incus_compose_installed_release | default('') != incus_compose_version

- name: Install the pinned incus-compose release
  become: true
  ansible.builtin.unarchive:
    src: "{{ incus_compose_archive }}"
    dest: /usr/local/bin
    include:
      - incus-compose
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  when:
    - incus_compose_install | bool
    - incus_compose_installed_release | default('') != incus_compose_version
    - not ansible_check_mode

- name: Remove the incus-compose archive
  become: true
  ansible.builtin.file:
    path: "{{ incus_compose_archive }}"
    state: absent
  when: not ansible_check_mode
