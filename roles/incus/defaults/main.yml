incus_admin_users:
  - "{{ compose_user | default('root') }}"

incus_storage_backend: dir
incus_storage_pools: []
incus_bridge_name: incusbr0
incus_firewalld_zone: trusted
# firewalld uses a trailing + to match dynamically named Compose bridges.
incus_compose_firewalld_interfaces:
  - icompose0
  - ic-+
incus_spice_html5_port: 8059
incus_default_profile_nic_name: eth0
incus_default_profile_root_name: root
incus_default_profile_root:
  path: /
  pool: default
  type: disk
incus_default_profile_nic:
  name: "{{ incus_default_profile_nic_name }}"
  network: "{{ incus_bridge_name }}"
  type: nic

# Keep the host on the Incus 7.0 LTS series supplied by Debian backports.
incus_apt_suite: trixie-backports
incus_package_version: "7.*"
incus_version_minimum: "7.0"
incus_version_maximum: "8.0"

incus_compose_install: true
incus_compose_oci_remotes:
  lscr.io: https://lscr.io # linuxserver.io images
incus_compose_version: "1.3.3"
incus_compose_architectures:
  x86_64: amd64
  aarch64: arm64
incus_compose_checksums:
  amd64: 9624f19675eb211fb537ee9f7e92408c40833dd51fc954eb06ea38a8e4060f93
  arm64: 92e76c5f1a50b91a341c5318a78988e66b8f6c662226c0b0720a75c3bb1ca49d
incus_compose_release_architecture: "{{ incus_compose_architectures.get(ansible_facts['architecture'], '') }}"
incus_compose_archive: "/var/tmp/incus-compose_{{ incus_compose_version }}_linux_{{ incus_compose_release_architecture }}.tar.gz"
incus_compose_api_port: 8443
incus_https_address: "127.0.0.1:{{ incus_compose_api_port }}"
