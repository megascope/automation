- name: Check IPv4 forwarding state
  become: true
  when: firewall_ipv4_forwarding
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -n net.ipv4.ip_forward
  register: firewall_ipv4_forwarding_state
  changed_when: false

- name: Enable IPv4 forwarding for current boot
  become: true
  when:
    - firewall_ipv4_forwarding
    - firewall_ipv4_forwarding_state.stdout != "1"
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -w net.ipv4.ip_forward=1

- name: Persist IPv4 forwarding
  become: true
  when:
    - firewall_ipv4_forwarding
    - firewall_persist
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    sysctl_file: "{{ firewall_sysctl_file }}"
    reload: true

- name: Check IPv6 forwarding state
  become: true
  when: firewall_ipv6_forwarding
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -n net.ipv6.conf.all.forwarding
  register: firewall_ipv6_forwarding_state
  changed_when: false

- name: Enable IPv6 forwarding for current boot
  become: true
  when:
    - firewall_ipv6_forwarding
    - firewall_ipv6_forwarding_state.stdout != "1"
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -w net.ipv6.conf.all.forwarding=1 net.ipv6.conf.default.forwarding=1

- name: Persist IPv6 forwarding
  become: true
  when:
    - firewall_ipv6_forwarding
    - firewall_persist
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    sysctl_set: true
    sysctl_file: "{{ firewall_sysctl_file }}"
    reload: true
  loop:
    - net.ipv6.conf.all.forwarding
    - net.ipv6.conf.default.forwarding

- name: Gather service state for firewall conflict checks
  ansible.builtin.service_facts:

- name: Refuse to configure firewalld over another firewall manager
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get('nftables.service', {}).get('state', 'stopped') != 'running'
      - ansible_facts.services.get('netfilter-persistent.service', {}).get('state', 'stopped') != 'running'
      - ansible_facts.services.get('ufw.service', {}).get('state', 'stopped') != 'running'
    fail_msg: >-
      A conflicting firewall service is active. Clean up nftables.service,
      netfilter-persistent.service, or ufw.service before running this role.

- name: Install firewalld
  become: true
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Enable and start firewalld
  become: true
  ansible.builtin.service:
    name: firewalld
    enabled: true
    state: started

- name: Create the Ansible-managed firewall zone
  become: true
  ansible.posix.firewalld:
    zone: "{{ firewall_zone }}"
    state: present
    permanent: true
  register: firewall_zone_created

# New zones exist only in the permanent configuration until firewalld reloads.
- name: Load the new firewall zone
  become: true
  ansible.builtin.command: firewall-cmd --reload
  when: firewall_zone_created is changed
  changed_when: true

- name: Configure managed firewall services
  become: true
  ansible.posix.firewalld:
    zone: "{{ firewall_zone }}"
    service: "{{ item.service }}"
    state: "{{ 'enabled' if item.enabled | bool else 'disabled' }}"
    permanent: true
    immediate: true
  loop:
    - service: ssh
      enabled: "{{ firewall_ssh }}"
    - service: http
      enabled: "{{ firewall_http }}"
    - service: https
      enabled: "{{ firewall_http }}"
  loop_control:
    label: "{{ item.service }}"

- name: Configure managed firewall ports
  become: true
  ansible.posix.firewalld:
    zone: "{{ firewall_zone }}"
    port: "{{ item.port }}"
    state: "{{ 'enabled' if item.enabled | bool else 'disabled' }}"
    permanent: true
    immediate: true
  loop:
    - port: 9993/udp
      enabled: "{{ firewall_zerotier }}"
    - port: 41641/udp
      enabled: "{{ firewall_tailscale }}"
    - port: 60000-61000/udp
      enabled: "{{ firewall_mosh }}"
  loop_control:
    label: "{{ item.port }}"

- name: Assign the Tailscale interface to the trusted zone
  become: true
  ansible.posix.firewalld:
    zone: "{{ firewall_tailscale_zone }}"
    interface: "{{ firewall_tailscale_interface }}"
    state: "{{ 'enabled' if firewall_tailscale | bool else 'disabled' }}"
    permanent: true
    immediate: true

- name: Set the firewall zone target
  become: true
  ansible.posix.firewalld:
    zone: "{{ firewall_zone }}"
    target: "{{ firewall_zone_target }}"
    state: present
    permanent: true
    immediate: true

- name: Read the current default firewall zone
  become: true
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: firewall_default_zone
  changed_when: false

# This is deliberately last so SSH and all other permitted services are in
# place before the restrictive zone begins handling unassigned interfaces.
- name: Make the Ansible-managed zone the default
  become: true
  ansible.builtin.command: "firewall-cmd --set-default-zone={{ firewall_zone }}"
  when: firewall_default_zone.stdout | trim != firewall_zone
  changed_when: true
