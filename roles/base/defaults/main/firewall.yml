# Set to true in host or group vars to configure firewalld.
firewall_enable: false

# Host services managed by the role.
firewall_ssh: true
firewall_zerotier: false
firewall_tailscale: false
firewall_mosh: false
firewall_http: false

# A dedicated zone avoids inheriting distribution-specific services from
# firewalld's built-in public zone. Unmatched traffic is dropped.
firewall_zone: ansible-managed
firewall_zone_target: DROP

# Enable and persist forwarding for routed workloads such as exit nodes.
firewall_ipv4_forwarding: false
firewall_ipv6_forwarding: false
firewall_sysctl_file: /etc/sysctl.d/99-firewall-forwarding.conf

# Tailscale is the trusted network. The UDP transport port is still opened in
# firewall_zone because those packets arrive through a physical interface.
firewall_tailscale_interface: tailscale0
firewall_tailscale_zone: trusted
